# The site made from its sources (tools/build-site.sh) and deployed to GitHub Pages from main: the ISA manuals,
# the NVN API (tools/gen-manual.py) and the documentation (tools/gen-docs.py) from ScarletNX's main, the book from
# book/ (tools/gen-book.py, which compiles and runs its programs). Every push and pull request builds and checks
# it; main deploys it, and again every day for ScarletNX's changes. Nothing made is committed. The repository's
# Pages source is "GitHub Actions".
#
# A part of the site that fails to be made (ScarletNX's sources changed in a way a generator doesn't read) is a page
# saying why, and the rest still deploys: build-site.sh's status 3. The report job then fails the run, after the
# deploy, so it shows; the build step's warnings say what failed.
name: Site
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.site.outputs.status }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check-site.py
      - run: sh tests/check-site.sh
      - run: sh tests/check-manual.sh
      - run: sh tests/check-book.sh
      - run: sh tests/check-docs.sh
      - run: sh tests/check-build.sh
      - uses: actions/checkout@v5
        with:
          repository: scarletnx/ScarletNX
          path: ScarletNX
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            docs
            src/common/cpu/aarch64/sail
            src/common/cpu/arm/sail
            src/nx/gpu/shader
            src/nx/gpu/nvn
            src/nx/gpu/vk
            src/3ds/gpu
            src/vita/gpu
            src/3ds/services
            src/android/framework
            src/nx/hle/hook
            src/nx/hle/svc
            src/nx/nn
      - id: site
        run: |
          status=0
          sh tools/build-site.sh ScarletNX _site || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = 0 ] || [ "$status" = 3 ]
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.status == '3'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Site made in part::A part of the site could not be made and is a page saying why; the rest was deployed. The build job's warnings say which part and why."
          exit 1
