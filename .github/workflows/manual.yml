# The ARM manual (manual/) made again from ScarletNX's Sail (tools/gen-arm-manual.py), and committed when it changes:
# the site is served from this branch as it is
name: Manual
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/gen-arm-manual.py, tools/manual/**, .github/workflows/manual.yml]
permissions:
  contents: write
concurrency: manual
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: scarletnx/ScarletNX
          path: ScarletNX
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            src/common/cpu/aarch64/sail
            src/common/cpu/arm/sail
      - run: python3 tools/gen-arm-manual.py ScarletNX manual
      - run: rm -rf ScarletNX && python3 tools/check-site.py && sh tests/check-manual.sh
      - name: Commit the manual when it changed
        run: |
          git add -A manual
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "[manual] Make the ARM manual from ScarletNX's Sail at $(sed -n 's/.*tree\/\([0-9a-f]\{12\}\).*/\1/p' manual/index.html)"
          git push
